<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PO Dashboard</title>

<link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">


<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>

</head>

<body>

<div class="sidepanel">
    <h2 class="logo">
         <i class="fa-solid fa-graduation-cap"></i>
        <span>OBE Analytics</span>
    </h2>

    <ul style="list-style:none;">
        <a href="index.html" class="nav-btn"><i class="fa-solid fa-table-columns"></i>Dashboard</a>
        <a href="attainment.html" class="nav-btn"><i class="fa-solid fa-chart-column"></i>PO Attainment</a>
        <a href="analytics.html" class="nav-btn"><i class="fa-solid fa-chart-line"></i>Analytics</a>
        <button class="nav-btn" onclick="logout()">
    <i class="fa-solid fa-arrow-right-from-bracket"></i>
    Logout
</button>
    </ul>
</div>

<div class="main">

    <div class="header">

        <h1>PO Attainment Visualization System</h1>

        <div class="options">

            <select id="department" onchange="updateSubjectList()">
          <option>Computer Science and Business Systems</option>
          <option>Computer Engineering</option>
          <option>AIDS</option>
          <option>IT</option>
          <option>EXCP</option>
          <option>ETRX</option>
          <option>CCE</option>
          <option>Mechanical</option>
          <option>EXTC</option>
          <option>Robotics and Artificial Engineering</option>
          <option>Electronics Engineering (VLSI)</option>
        </select>

            <select id="semester" onchange="updateSubjectList()">
                <option>Semester 1</option>
                <option>Semester 2</option>
            </select>

            <select id="subject">
                
            </select>

            <button onclick="updateChart()">Apply</button>

        </div>

    </div>

    <div class="attainment-layout">

        <div class="graph-panel">

            <div class="graph-header">
                <h2>PO Attainment Analysis</h2>

                <select id="chartType">
                    <option value="bar">Bar Chart</option>
                    <option value="line">Line Chart</option>
                    <option value="pie">Pie Chart</option>
                </select>
            </div>

            <canvas id="poChart"></canvas>

        </div>

        <div class="report-panel">

            <h2>Report Summary</h2>

            <div class="report-card">
                <h3>Average Attainment</h3>
                <p id="averagePO">82%</p>
            </div>

            <div class="report-card">
                <h3>Highest PO</h3>
                <p id="highestPO">PO3 (91%)</p>
            </div>

            <div class="report-card">
                <h3>Weakest PO</h3>
                <p id="weakestPO">PO4 (69%)</p>
            </div>

            <div class="report-card">
                <h3>Remarks</h3>
                <p id="remarks">
                    Overall attainment is satisfactory.
                    Focus on improving weaker outcomes.
                </p>
            </div>

        </div>

    </div>

</div>

<script>

let currentPONames = [];

let chart = new Chart(
    document.getElementById("poChart"),
    {
        type: "bar",
        data: {
            labels: [],
            datasets: [{
                label: "PO Attainment (%)",
                data: [],
                backgroundColor: "#74b9e7",
                borderColor: "#74b9e7"
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    }
);


function updateSubjectList(){

    let department =
        document.getElementById("department").value;

    let semester =
        document.getElementById("semester").value;

    let subject =
        document.getElementById("subject");

    subject.innerHTML = "";

    if(!departmentData[department]){
        return;
    }

    if(!departmentData[department][semester]){
        return;
    }

    let subjects =
        departmentData[department][semester];

    for(let subjectName in subjects){

        let option =
            document.createElement("option");

        option.value = subjectName;
        option.textContent = subjectName;

        subject.appendChild(option);
    }
}


function updateChart(){

    let department =
        document.getElementById("department").value;

    let semester =
        document.getElementById("semester").value;

    let subject =
        document.getElementById("subject").value;


    console.log("Department:", department);
    console.log("Semester:", semester);
    console.log("Subject:", subject);


    let subjectInfo =
        departmentData[department]?.[semester]?.[subject];


    if(!subjectInfo){

        alert("Please select a valid subject.");

        return;
    }


    let data =
        subjectInfo.values;

    currentPONames =
        subjectInfo.pos;


    /*
       SAVE SELECTION
    */

    localStorage.setItem(
        "selectedDepartment",
        department
    );

    localStorage.setItem(
        "selectedSemester",
        semester
    );

    localStorage.setItem(
        "selectedSubject",
        subject
    );


    /*
       SAVE DASHBOARD DATA
    */

    localStorage.setItem(
        "dashboardData",
        JSON.stringify(data)
    );

    localStorage.setItem(
        "dashboardLabels",
        JSON.stringify(currentPONames)
    );


    /*
       AVERAGE
    */

    let sum = 0;

    for(let i = 0; i < data.length; i++){

        sum += data[i];

    }

    let average =
        sum / data.length;


    /*
       HIGHEST
    */

    let highestIndex = 0;

    for(let i = 1; i < data.length; i++){

        if(data[i] > data[highestIndex]){

            highestIndex = i;

        }

    }


    /*
       WEAKEST
    */

    let weakestIndex = 0;

    for(let i = 1; i < data.length; i++){

        if(data[i] < data[weakestIndex]){

            weakestIndex = i;

        }

    }


    /*
       SAVE REPORT DATA
    */

    localStorage.setItem(
        "averagePO",
        average.toFixed(1) + "%"
    );

    localStorage.setItem(
        "highestPO",
        currentPONames[highestIndex] +
        " (" +
        data[highestIndex] +
        "%)"
    );

    localStorage.setItem(
        "weakestPO",
        currentPONames[weakestIndex] +
        " (" +
        data[weakestIndex] +
        "%)"
    );


    /*
       UPDATE REPORT
    */

    document.getElementById("averagePO").innerHTML =
        average.toFixed(1) + "%";


    document.getElementById("highestPO").innerHTML =
        currentPONames[highestIndex] +
        " (" +
        data[highestIndex] +
        "%)";


    document.getElementById("weakestPO").innerHTML =
        currentPONames[weakestIndex] +
        " (" +
        data[weakestIndex] +
        "%)";


    /*
       UPDATE REMARK
    */

    if(average >= 85){

        document.getElementById("remarks").innerHTML =
            "Excellent attainment achieved across most Program Outcomes.";

    }

    else if(average >= 75){

        document.getElementById("remarks").innerHTML =
            "Overall attainment is satisfactory. Focus on weaker outcomes.";

    }

    else{

        document.getElementById("remarks").innerHTML =
            "Improvement required in multiple Program Outcomes.";

    }


    /*
       UPDATE CHART
    */

    chart.destroy();

    chart = new Chart(
        document.getElementById("poChart"),
        {
            type:
                document.getElementById("chartType").value,

            data: {

                labels:
                    currentPONames,

                datasets: [{

                    label:
                        "PO Attainment (%)",

                    data:
                        data,

                    backgroundColor:
                        "#74b9e7",

                    borderColor:
                        "#74b9e7"

                }]

            },

            options: {

                responsive: true,

                maintainAspectRatio: false

            }
        }
    );

}





window.onload = function(){

    let department =
        localStorage.getItem("selectedDepartment");

    let semester =
        localStorage.getItem("selectedSemester");

    let subject =
        localStorage.getItem("selectedSubject");


    /*
       LOAD DEPARTMENT
    */

    if(department){

        document.getElementById("department").value =
            department;

    }


    /*
       LOAD SEMESTER
    */

    if(semester){

        document.getElementById("semester").value =
            semester;

    }


    /*
       CREATE SUBJECT LIST
    */

    updateSubjectList();


    /*
       LOAD SUBJECT
    */

    if(subject){

        let subjectSelect =
            document.getElementById("subject");

        let exists = false;

        for(let i = 0; i < subjectSelect.options.length; i++){

            if(subjectSelect.options[i].value === subject){

                exists = true;

                break;

            }

        }


        if(exists){

            subjectSelect.value =
                subject;

        }

    }


    /*
       UPDATE PAGE
    */

    updateChart();

};




</script>

</body>
</html>
