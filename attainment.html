<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PO Dashboard</title>

<link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="sidepanel">
    <h2 class="logo">
         <i class="fa-solid fa-graduation-cap"></i>
        <span>OBE Analytics</span>
    </h2>

    <ul style="list-style:none;">
        <a href="index.html" class="nav-btn"><i class="fa-solid fa-table-columns"></i>Dashboard</a>
        <a href="attainment.html" class="nav-btn"><i class="fa-solid fa-chart-column"></i>PO Attainment</a>
        <a href="analytics.html" class="nav-btn"><i class="fa-solid fa-chart-line"></i>Analytics</a>
        <button class="nav-btn">
             <i class="fa-solid fa-arrow-right-from-bracket"></i>
            Logout
        </button>
    </ul>
</div>

<div class="main">

    <div class="header">

        <h1>PO Attainment Visualization System</h1>

        <div class="options">

            <select>
          <option>Computer Science and Business Systems</option>
          <option>Computer Engineering</option>
          <option>AIDS</option>
          <option>IT</option>
          <option>EXCP</option>
          <option>ETRX</option>
          <option>CCE</option>
          <option>Mechanical</option>
          <option>EXTC</option>
          <option>Robotics and Aritificial Engineering</option>
          <option>Electronics Engineering (VLSI)</option>
        </select>

            <select id="semester">
                <option>Semester 1</option>
                <option>Semester 2</option>
            </select>

            <select id="subject">
                <option>Applied Mathematics I</option>
                <option>Applied Mathematics II</option>
                <option>Engineering Physics</option>
                <option>Engineering Chemistry</option>
                <option>Applied Science for Computer Allied Subjects</option>
                <option>Structured Programming Methodology</option>
                <option>Object Oriented Programming Methodology</option>
            </select>

            <button onclick="updateChart()">Apply</button>

        </div>

    </div>

    <div class="attainment-layout">

        <div class="graph-panel">

            <div class="graph-header">
                <h2>PO Attainment Analysis</h2>

                <select id="chartType" onchange="changeChartType()">
                    <option value="bar">Bar Chart</option>
                    <option value="line">Line Chart</option>
                    <option value="pie">Pie Chart</option>
                </select>
            </div>

            <canvas id="poChart"></canvas>

        </div>

        <div class="report-panel">

            <h2>Report Summary</h2>

            <div class="report-card">
                <h3>Average Attainment</h3>
                <p id="averagePO">82%</p>
            </div>

            <div class="report-card">
                <h3>Highest PO</h3>
                <p id="highestPO">PO3 (91%)</p>
            </div>

            <div class="report-card">
                <h3>Weakest PO</h3>
                <p id="weakestPO">PO4 (69%)</p>
            </div>

            <div class="report-card">
                <h3>Remarks</h3>
                <p id="remarks">
                    Overall attainment is satisfactory.
                    Focus on improving weaker outcomes.
                </p>
            </div>

        </div>

    </div>

</div>

<script>

// Semester 1
const math1 = [82,76,91,69,74,80];
const physics1 = [70,85,88,75,80,90];
const spm1 = [88,92,90,84,95];

// Semester 2
const math2 = [75,70,82,68,79];
const chemistry2 = [81,78,90,74,80,86];
const science2 = [86,82,91,84,89];
const oopm2 = [90,94,92,85,96];




const math1POs = [
        "Matrices",
        "Partial Differentiation",
        "Homogeneous Functions",
        "Linear Differential Equations",
        "Probability",
        "Complex Numbers"
    ];


    const physics1POs = [
        "Magnetism",
        "Wave Optics",
        "Photonics",
        "Quantum-Mechanics",
        "Electrodynamics",
        "Photonics"
        
    ];


    const spm1POs = [
        "Introduction to C",
        "Variables",
        "Unions",
        "Arrays and Structures",
        "Memory Allocations"
        
    ];

    const math2POs = [
        "Integrals",
        "DE",
        "Series",
        "Vectors",
        "Transforms"
        
    ];

  
        const chemistry2POs = [
        "Water Treatment",
        "Green Chemistry",
        "Organic Reactions",
        "Electrochemistry",
        "Sensors"
    ];
    

    const science2POs =[
        "Transistors",
        "Wave Equations",
        "Corrosion",
        "Batteries",
        "Semiconductor"
    ];

    const oopm2POs =[
        "Classes",
        "Objects",
        "Inheritance",
        "Polymorphism",
        "Exception Handling"
    ];

    let currentPONames = math1POs;

    


let chart = new Chart(
    document.getElementById("poChart"),
    {
        type: "bar",
        data: {
            labels: currentPONames,
            datasets: [{
                label: "PO Attainment (%)",
                data: math1,
                backgroundColor: "#74b9e7",
                borderColor: "#74b9e7"
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    }
);

function updateReport(data){

 

    let max = Math.max(...data);
    let min = Math.min(...data);

    let maxIndex = data.indexOf(max) + 1;
    let minIndex = data.indexOf(min) + 1;

    let avg =
        data.reduce((sum,val)=>sum+val,0) / data.length;


    // Save in browser

localStorage.setItem("averagePO", avg.toFixed(1) + "%");
localStorage.setItem(
    "highestPO",
    currentPONames[maxIndex - 1] + " (" + max + "%)"
);

localStorage.setItem(
    "weakestPO",
    currentPONames[minIndex - 1] + " (" + min + "%)"
);



    document.getElementById("averagePO").innerHTML =
        avg.toFixed(1) + "%";

    document.getElementById("highestPO").innerHTML =
    `${currentPONames[maxIndex - 1]} (${max}%)`;

document.getElementById("weakestPO").innerHTML =
    `${currentPONames[minIndex - 1]} (${min}%)`;

    if(avg >= 85){
        document.getElementById("remarks").innerHTML =
        "Excellent attainment achieved across most Program Outcomes.";
    }
    else if(avg >= 75){
        document.getElementById("remarks").innerHTML =
        "Overall attainment is satisfactory. Focus on weaker outcomes.";
    }
    else{
        document.getElementById("remarks").innerHTML =
        "Improvement required in multiple Program Outcomes.";
    }
}

function updateChart(){

    let sem = document.getElementById("semester").value;
    let sub = document.getElementById("subject").value;
   
    let data = []; 

    if(sem === "Semester 1"){

        if(sub === "Applied Mathematics I"){
            data = math1;
            currentPONames = math1POs;
        }

        else if(sub === "Engineering Physics"){
            data = physics1;
            currentPONames = physics1POs;
        }

        else if(sub === "Structured Programming Methodology"){
            data = spm1;
            currentPONames = spm1POs;
        }
            
    }

    else if(sem === "Semester 2"){

        if(sub === "Applied Mathematics II"){
            data = math2;
            currentPONames = math2POs;
        }

        else if(sub === "Engineering Chemistry"){
            data = chemistry2; 
            currentPONames = chemistry2POs;
        }

        else if(sub === "Applied Science for Computer Allied Subjects"){
            data = science2;
            currentPONames = science2POs;
        }

        else if(sub === "Object Oriented Programming Methodology"){
            data = oopm2;
            currentPONames = oopm2POs;
        }
    }

    if(data.length === 0){
        alert("Please select a subject that belongs to the chosen semester.");
        return;
    }
 
    console.log("Semester =", sem);
    console.log("Subject =", sub);
    console.log("Data =", data);


localStorage.setItem("dashboardData", JSON.stringify(data));

    localStorage.setItem(
    "dashboardLabels",
    JSON.stringify(currentPONames)
);
  


    chart.destroy();

chart = new Chart(
    document.getElementById("poChart"),
    {
        type: document.getElementById("chartType").value,
        data: {
            labels: currentPONames,
            datasets: [{
                label: "PO Attainment (%)",
                data: data,
                backgroundColor: "#74b9e7",
                borderColor: "#74b9e7"
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    }
);

updateReport(data);
}

function changeChartType(){

    let type = document.getElementById("chartType").value;

    let currentData = chart.data.datasets[0].data;

    chart.destroy();

    chart = new Chart(
    document.getElementById("poChart"),
    {
        type:type,
        data:{
            labels: currentPONames,
            datasets:[{
                label:"PO Attainment (%)",
                data:currentData,
                backgroundColor:"#74b9e7",
                borderColor:"#74b9e7"
            }]
        },
            options:{
                responsive:true,
                maintainAspectRatio:false
            }
        }
    );


}

updateReport(math1);

window.onload = function(){

    let sem = localStorage.getItem("selectedSemester");
    let sub = localStorage.getItem("selectedSubject");

    if(sem){
        document.getElementById("semester").value = sem;
    }

    if(sub){
        document.getElementById("subject").value = sub;
    }

    updateChart();

}








</script>

</body>
</html>
