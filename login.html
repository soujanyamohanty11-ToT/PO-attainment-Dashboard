<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f7fb;
        }

        .login-box {
            width: 400px;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            text-align: center;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #2563eb;
            color: white;

            border-radius: 50%;
            font-size: 30px;
        }

        .login-box h2 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
        }

        .input-box {
            position: relative;
        }

        .input-box i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .input-box input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid #dbe2ea;
            border-radius: 8px;
            outline: none;
            font-size: 15px;
        }

        .input-box input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37,99,235,0.1);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        #error {
            color: #dc2626;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <div class="logo-icon">
            <i class="fa-solid fa-graduation-cap"></i>
        </div>

        <h2>OBE Analytics</h2>

        <p class="subtitle">
            Administrator Login
        </p>

        <form onsubmit="login(event)">

            <div class="input-group">

                <label>Username</label>

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                    >

                </div>

            </div>


            <div class="input-group">

                <label>Password</label>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                    >

                </div>

            </div>


            <button type="submit" class="login-btn">
                Login
            </button>

            <p id="error">
                Invalid username or password.
            </p>

        </form>

    </div>


    <script>

        function login(event) {

            event.preventDefault();

            let username =
                document.getElementById("username").value;

            let password =
                document.getElementById("password").value;


            if(username === "admin" && password === "1234") {

                localStorage.setItem("isLoggedIn", "true");

                window.location.href = "index.html";

            }

            else {

                document.getElementById("error").style.display = "block";

            }

        }

    </script>

</body>

</html>
